[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-dissertation-benchmark"
version = "0.1.0"
description = "Terminal UI and CLI for benchmarking OpenRouter LLM sentiment analysis on dissertation data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "textual>=0.80",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
]
# VADER lexicon baseline (downloads the lexicon on first use).
baselines = [
    "nltk>=3.8",
]
# FinBERT transformer baseline (large download of model weights on first use).
finbert = [
    "transformers>=4.40",
    "torch>=2.0",
]
# Publication-ready figures written into run exports.
figures = [
    "matplotlib>=3.7",
]

[project.scripts]
sentiment-bench = "sentiment_benchmark.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src/sentiment_benchmark"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
