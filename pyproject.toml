[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-dissertation-benchmark"
version = "0.1.0"
description = "Terminal UI and CLI for benchmarking OpenRouter, Cerebras, and Ollama LLM sentiment analysis on dissertation data."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "exchange-calendars>=4.13,<5",
    "httpx>=0.27",
    "libsql>=0.1.11",
    "numpy>=1.26",
    "ollama>=0.6",
    "pandas>=2.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "statsmodels>=0.14,<1",
    "tavily-python>=0.7",
    "textual>=0.80",
    "typer>=0.12",
    "yfinance>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "lxml>=5,<7",
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
]
# VADER lexicon baseline (downloads the lexicon on first use).
baselines = [
    "nltk>=3.8",
]
# FinBERT transformer baseline (large download of model weights on first use).
finbert = [
    "transformers>=4.40",
    "torch>=2.0",
]
# Publication-ready figures written into run exports.
figures = [
    "matplotlib>=3.7",
]
# Sentiment-conditioned tail-risk notebook (FNSPID VaR/ES experiment).
# arch supplies the validated GJR-GARCH(1,1)-t estimator; the Jupyter stack
# executes notebooks/fnsipid_tail_risk_core.ipynb non-interactively.
tailrisk = [
    "arch>=7.2,<8",
    "ipykernel>=6.29",
    "jupytext>=1.16",
    "matplotlib>=3.7",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "pyarrow>=15",
]
# LSEG Workspace news collection and deterministic story-body cleaning.
lseg = [
    "lseg-data>=2.1.1,<3",
    "lxml>=5,<7",
]

[project.scripts]
sentiment-bench = "sentiment_benchmark.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/sentiment_benchmark"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
