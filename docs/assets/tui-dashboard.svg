  <text x="1080" y="61" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="13" fill="#cbd5e1">Dashboard | provider setup | run readiness</text>

  <rect x="72" y="108" width="1036" height="42" rx="6" fill="#17212b" stroke="#334155"/>
