  <text x="116" y="559" font-family="Menlo, Consolas, monospace" font-size="14" fill="#e2e8f0">http://desktop-pc:11434</text>

  <rect x="598" y="260" width="510" height="310" rx="8" fill="#17212b" stroke="#334155"/>
