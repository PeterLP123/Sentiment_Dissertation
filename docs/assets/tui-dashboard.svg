<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700" role="img" aria-labelledby="title desc">
  <title id="title">Terminal UI dashboard provider controls screenshot</title>
  <desc id="desc">A screenshot-style illustration of the Sentiment Benchmark TUI dashboard with OpenRouter and Ollama provider controls.</desc>
