<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">CLI Tavily news fetch screenshot</title>
  <desc id="desc">A terminal-style screenshot showing the fetch-news command and its saved article corpus outputs.</desc>
  <rect width="1100" height="560" fill="#f4f6f8"/>
  <rect x="56" y="44" width="988" height="472" rx="8" fill="#101820" stroke="#263241"/>
  <rect x="56" y="44" width="988" height="40" rx="8" fill="#1e2a36"/>
  <circle cx="82" cy="64" r="6" fill="#ff5f56"/>
  <circle cx="104" cy="64" r="6" fill="#ffbd2e"/>
  <circle cx="126" cy="64" r="6" fill="#27c93f"/>
  <text x="548" y="70" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#cbd5e1">sentiment-bench fetch-news</text>

  <text x="86" y="124" font-family="Menlo, Consolas, monospace" font-size="17" fill="#e2e8f0">$ sentiment-bench fetch-news --query "bank earnings sentiment" \</text>
  <text x="112" y="154" font-family="Menlo, Consolas, monospace" font-size="17" fill="#e2e8f0">--max-results 10 --time-range week --output-dir Data/news</text>

  <rect x="86" y="190" width="928" height="230" rx="6" fill="#17212b" stroke="#334155"/>
  <text x="550" y="226" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="18" fill="#f8fafc">Tavily News Fetch</text>
  <line x1="112" y1="246" x2="988" y2="246" stroke="#334155"/>
  <text x="122" y="280" font-family="Menlo, Consolas, monospace" font-size="15" fill="#93c5fd">Query</text>
  <text x="348" y="280" font-family="Menlo, Consolas, monospace" font-size="15" fill="#e2e8f0">bank earnings sentiment</text>
  <text x="122" y="314" font-family="Menlo, Consolas, monospace" font-size="15" fill="#93c5fd">Records</text>
  <text x="348" y="314" font-family="Menlo, Consolas, monospace" font-size="15" fill="#e2e8f0">10</text>
  <text x="122" y="348" font-family="Menlo, Consolas, monospace" font-size="15" fill="#93c5fd">Failed extractions</text>
  <text x="348" y="348" font-family="Menlo, Consolas, monospace" font-size="15" fill="#e2e8f0">0</text>
  <text x="122" y="382" font-family="Menlo, Consolas, monospace" font-size="15" fill="#93c5fd">Output</text>
  <text x="348" y="382" font-family="Menlo, Consolas, monospace" font-size="15" fill="#e2e8f0">Data/news/tavily_news_20260607T120000Z_bank-earnings-sentiment</text>

  <text x="86" y="456" font-family="Menlo, Consolas, monospace" font-size="16" fill="#a7f3d0">Saved:</text>
  <text x="160" y="456" font-family="Menlo, Consolas, monospace" font-size="16" fill="#e2e8f0">articles.jsonl, articles.csv, manifest.json</text>
  <text x="86" y="488" font-family="Menlo, Consolas, monospace" font-size="15" fill="#94a3b8">Article bodies are saved to files, not printed to the terminal.</text>
</svg>
