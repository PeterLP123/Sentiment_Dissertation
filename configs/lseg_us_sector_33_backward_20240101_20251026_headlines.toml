# Immutable backward time-extension for the frozen sector-33 hybrid test.
#
# This repeats the exact original-33 RIC query universe over a contiguous period
# ending before the opened 2025-10-26--2026-06-26 window. It collects every
# entitled English-language headline source and no story bodies. The collection
# is resumable across daily quota batches. Prices and returns remain sealed until
# the separately frozen population and signal gates pass.

[collection]
id = "us_sector_33_backward_20240101_20251026_headlines"
start = "2024-01-01T00:00:00Z"
end = "2025-10-26T00:00:00Z"
language = "en"
session = "desktop"
page_size = 100
max_pages = 50
retries = 3
requests_per_second = 3.0
max_requests_per_run = 9500
window_days = 1
fetch_story_bodies = false

[cleaning]
min_text_chars = 0
max_scoring_chars = 1000

[outputs]
raw_output_root = "Data/collections/lseg_us_sector_33_backward_20240101_20251026_headlines/raw"
derived_output_root = "Data/collections/lseg_us_sector_33_backward_20240101_20251026_headlines/derived"

