version = 1
description = "Per-ticker Tavily query matrix for the prospective single-name news panel (L2 event-study arm)."

# ---------------------------------------------------------------------------
# Panel design (drafted 2026-06-12)
#
# Purpose: contamination-free, per-name, timestamped 2026 news for the L2
# single-stock event study (and the L1/L2 futures overlay). This matrix is
# collected ALONGSIDE the thematic matrix (tavily_query_matrix.toml), which
# remains the labeling corpus.
#
# Panel selection criteria:
#   * Index membership: S&P 100 (US arm) or FTSE 100 (UK arm).
#   * High news flow: mega-caps and names with dense, regular coverage, so the
#     event study has power per name.
#   * Sector spread within each arm (tech, banks, energy, healthcare,
#     consumer, industrials/defence, miners).
#   * Search disambiguity: names whose company reference can be anchored with
#     ticker or "plc"/"Holdings" suffixes (e.g. Shell plc, Rolls-Royce
#     Holdings, Prudential plc) to avoid off-topic results.
#
# FREEZE PROTOCOL: the panel is frozen like the model roster — additions or
# removals after the first formal collection week mean a survivorship-biased
# panel.
#
# MEMBERSHIP VERIFIED 2026-06-12: all 25 US names confirmed in the S&P 100
# (Wikipedia constituent list, current through the March 2026 rebalance which
# added MU/LRCX/AMAT/GEV and deleted PYPL/AIG/MET/TGT — none of ours; the
# June 2026 rebalance announced 6 Jun has no S&P 100 changes). All 20 UK
# names confirmed in the FTSE 100 (Wikipedia list updated 20 Mar 2026; the
# June 2026 annual review effective 22 Jun adds Aberdeen/Computacenter/
# Investec and drops Berkeley/Mondi/Rightmove — none of ours). Known forward
# risk: Anglo American–Teck merger (see uk_aal notes).
#
# Tiers (encoded in each entry's notes):
#   * core (24 names) — always fetched; sized to fit free-tier credits with
#     headroom for the thematic matrix.
#   * extended (21 names) — fetch when credit budget allows.
#   Core ids: us_aapl us_msft us_nvda us_googl us_amzn us_meta us_tsla us_jpm
#             us_gs us_bac us_xom us_ba us_lly us_intc
#             uk_azn uk_shel uk_hsba uk_bp uk_ulvr uk_rio uk_barc uk_lloy
#             uk_rr uk_glen
#
# Credit sizing (verify against current Tavily plan before the first run):
#   per entry per weekly window ≈ 1 credit (basic search) + ~4 credits
#   (advanced extract, 2 per 5 URLs, max_results = 10) ≈ 5 credits.
#   Core tier: 24 × 5 = ~120/week (~500/month). Full panel: 45 × 5 =
#   ~225/week (~950/month) — full panel + thematic matrix exceeds a
#   1,000-credit free tier; budget or subset accordingly.
#
# WEEK-1 RELEVANCE CALIBRATION (2026-06-12, three rounds, ~400 credits of
# tuition). 14 entries (SHEL BATS BA. PRU XOM CVX AZN ULVR TSCO LLOY RIO DGE
# AAL DIS) ran below 70% on-topic by a title/snippet entity-mention
# heuristic; two recalibration rounds tested (a) entity/ticker re-anchoring
# + search_depth="advanced" and (b) '"<Exact Name>" share price news' +
# topic="finance". Conclusions:
#   * search_depth = "advanced" makes relevance WORSE for entity queries
#     (market roundups, SEO listicles). Do not use here.
#   * topic = "finance" looked better in search-only A/B tests, but the win
#     came from Yahoo Finance inventory — which this matrix excludes for
#     extraction reasons. With Yahoo excluded it returns generic market
#     commentary. Dead end.
#   * The title/snippet substring heuristic itself over-counts for generic
#     aliases ('shell' matches any oil-sector piece, 'Jeff Shell' etc.) —
#     n=10 weekly samples cannot reliably rank query variants. Stop tuning.
#   * Queries are therefore kept in their ORIGINAL simple form. Exception:
#     uk_pru's round-2 variant is kept — eyeballed 10/10 genuinely
#     entity-specific titles vs 0/10 for the original.
#   * Expected per-name search precision: US ticker-anchored names ~90-100%;
#     ambiguous/UK names floor at ~10-50% regardless of phrasing. This is a
#     Tavily limitation, not a query bug.
# IMPLICATIONS: (1) a post-hoc entity-relevance screen on extracted article
# TEXT (not search snippets) is REQUIRED before event-study use; (2) for
# reliable per-name event streams, primary sources (LSE RNS, SEC EDGAR 8-K)
# beat news search on entity attribution by construction — Tavily supplies
# the journalism overlay, not the event backbone.
#
# Settings rationale (lessons from the thematic runs, 2026-06-11):
#   * topic = "news" — topic = "finance" had thin inventory with Yahoo
#     excluded; single-name queries need the wider pool.
#   * max_results = 10 (not 20) — halves extraction cost; most single names
#     won't yield 20 distinct usable articles in a 7-day window anyway.
#   * extract_depth = "advanced" — basic extraction returned nav boilerplate
#     and error pages.
#   * Yahoo Finance excluded — serves error pages to the extractor; content
#     is syndicated and reachable at the original source.
#   * family = one ticker per entry, so `news-quality` per-family yield IS
#     the per-name density estimate the W3 power calculation needs.
#   * time_range = "week" only applies to ad-hoc fetches; fetch-news-batch
#     passes explicit 7-day windows and ignores it.
#
# Usage:
#   sentiment-bench fetch-news-batch \
#     --query-matrix configs/tavily_ticker_query_matrix.toml \
#     --weeks 1 \
#     --package-id tavily_ticker_panel_v1
#   (identical-parameter fetches are skipped, so a weekly run is resumable;
#   validate edits with --dry-run first.)
# ---------------------------------------------------------------------------

# ----------------------------- US arm (S&P 100) ----------------------------

[[queries]]
id = "us_aapl"
family = "AAPL — Apple"
query = "Apple AAPL stock news"
topic = "news"
time_range = "week"
max_results = 10
search_depth = "basic"
extract_depth = "advanced"
coverage_target = "Company-specific news for Apple Inc (NASDAQ: AAPL)."
include_domains = []
exclude_domains = ["finance.yahoo.com", "ca.finance.yahoo.com"]
notes = "Tier: core. Ticker anchors against fruit/generic uses of 'apple'."

