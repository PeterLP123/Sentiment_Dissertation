version = 1
description = "Reusable Tavily query matrix for a balanced initial current-financial-news source dataset."

# Quality settings shared by every entry: extract_depth = "advanced" because
# basic extraction returned navigation boilerplate and error pages in the first
# run, and Yahoo Finance is excluded because its pages consistently serve an
# "Oops, something went wrong" error page to the extractor (its content is
# mostly syndicated and available at the original source).
#
# Topic choice (2026-06-11): with Yahoo excluded, topic = "finance" has thin
# inventory for some themes — credit risk, market rally/selloff, mergers, and
# commodities returned 0-40 records across five weekly windows while the same
# queries with topic = "news" returned full pages, so those four use "news".

[[queries]]
id = "bank_earnings"
family = "Bank earnings"
query = "bank earnings profit margins loan losses outlook market reaction"
topic = "finance"
time_range = "month"
max_results = 20
search_depth = "basic"
extract_depth = "advanced"
coverage_target = "Bank performance, credit quality, margins, and investor reaction."
include_domains = []
exclude_domains = ["finance.yahoo.com", "ca.finance.yahoo.com"]
notes = "Useful for clear firm-level financial sentiment and sector-specific language."

[[queries]]
id = "corporate_earnings_guidance"
family = "Corporate earnings and guidance"
query = "company earnings revenue profit guidance outlook shares rise fall"
topic = "finance"
time_range = "month"
max_results = 20
search_depth = "basic"
extract_depth = "advanced"
coverage_target = "Broad company earnings, forecast changes, and share-price reaction."
include_domains = []
exclude_domains = ["finance.yahoo.com", "ca.finance.yahoo.com"]
notes = "Core source pool for later positive, negative, and neutral company-level sentiment labeling."

