include_domains = []
exclude_domains = ["finance.yahoo.com", "ca.finance.yahoo.com"]
notes = "Captures event-driven market tone across equities, bonds, and currencies. Shortened on 2026-06-11 after the original query under-delivered (22 records across five windows)."

