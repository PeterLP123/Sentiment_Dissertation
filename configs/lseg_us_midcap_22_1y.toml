# Deadline-bounded Reuters headline collection for a diversified US mid-cap panel.
#
# The one-year interval stays inside the LSEG news endpoint's documented
# historical depth. Source:RTRS is applied in every query and story-body
# retrieval is disabled, keeping the collection inside a single-day request
# budget. This is an exploratory robustness panel, not the dissertation's
# confirmatory core universe.

[collection]
id = "us_midcap_22_1y"
start = "2025-06-26T00:00:00Z"
end = "2026-06-26T00:00:00Z"
language = "en"
session = "desktop"
page_size = 100
max_pages = 50
retries = 3
requests_per_second = 3.0
max_requests_per_run = 8000
window_days = 7
fetch_story_bodies = false

[cleaning]
min_text_chars = 0
max_scoring_chars = 1000

[outputs]
raw_output_root = "Data/collections/lseg_us_midcap_22_1y/raw"
derived_output_root = "Data/collections/lseg_us_midcap_22_1y/derived"

# Information technology

[[companies]]
symbol = "DLB"
name = "Dolby Laboratories Inc."
ric = "DLB.N"
news_query = "R:DLB.N and Language:LEN and Source:RTRS"
aliases = ["Dolby", "Dolby Laboratories"]

