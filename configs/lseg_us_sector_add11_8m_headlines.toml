# Immutable breadth extension for the sector-balanced LSEG headline corpus.
#
# One high-liquidity US large-cap company is added per sector. The additions
# were frozen before retrieval and without inspecting their returns or sentiment
# results. All entitled English-language sources are retained; bodies are not
# requested. This is a breadth robustness arm and does not alter the original
# sector-33 analysis population.

[collection]
id = "us_sector_add11_8m_headlines"
start = "2025-10-26T00:00:00Z"
end = "2026-06-26T00:00:00Z"
language = "en"
session = "desktop"
page_size = 100
max_pages = 50
retries = 3
requests_per_second = 3.0
max_requests_per_run = 8000
window_days = 1
fetch_story_bodies = false

[cleaning]
min_text_chars = 0
max_scoring_chars = 1000

[outputs]
raw_output_root = "Data/collections/lseg_us_sector_add11_8m_headlines/raw"
derived_output_root = "Data/collections/lseg_us_sector_add11_8m_headlines/derived"

# Information technology
[[companies]]
symbol = "AVGO"
name = "Broadcom Inc."
ric = "AVGO.O"
news_query = "R:AVGO.O and Language:LEN"
aliases = ["Broadcom", "Broadcom Inc.", "AVGO"]

