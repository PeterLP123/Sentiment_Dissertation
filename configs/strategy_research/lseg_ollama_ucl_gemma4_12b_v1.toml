# Local-only strategy scorer configuration. Ollama must be reached through an
# SSH local forward at 127.0.0.1:11435. The current worker can be replaced as
# long as the exact model digest below is served. Full tuning/backtest remains
# blocked until the adjusted-open price panel and manifest exist.

[run]
id = "lseg-ollama-gemma4-12b-v1"
title = "LSEG 33-company local Gemma 4 12B decay strategy v1"
mode = "formal"
# Leaves exactly 100 development sessions and 25 evaluation sessions in the
# frozen 2025-12-26 through 2026-06-26 event decision-session range.
evaluation_start = "2026-05-21"

[data]
source = "lseg"
corpus_manifest = "Data/collections/lseg_us_sector_33_6m/derived/us_sector_33_6m/manifest.json"
event_identity = "earliest_story_family_symbol"
text_unit = "headline_plus_lead"
exchange_calendar = "XNYS"
exchange_timezone = "America/New_York"
processing_buffer_minutes = 15
fail_on_invalid_timestamp = true

[scoring]
provider = "ollama"
model = "gemma4:12b"
endpoint = "http://127.0.0.1:11435"
model_digest = "4eb23ef187e2c5462566d6a1d3bbbc2f1346d0b4327cbb66d58fffbcc9b2b05c"
competence_evidence_path = "experiments/strategy_local_gemma4_12b_pilot_20260716.toml"
competence_experiment_id = "strategy-local-gemma4-12b-pilot-20260716"
scheme = "three_class"
prompt_id = "strategy_target_direction_3class_v1"
prompts_path = "configs/strategy_research/prompts.toml"
temperature = 0.0
samples = 1
target_specific = true
allow_missing_as_neutral = false
minimum_success_rate = 0.98
max_completion_tokens = 64
ollama_think = false
concurrency = 1
retries = 3

[signal]
variant = "decay_with_reset"
fixed_hold_sessions = 3
half_life_sessions = 3
severity_power = 1.5
reversal_reset = 0.75
impulse_scale = 1.0
state_cap = 3.0
state_scale_quantile = 0.75
scale_shrinkage_k = 50
minimum_state_scale = 0.05
no_trade_band = 0.10

[prices]
panel_path = "Data/derived/prices/lseg_us_sector_33_strategy_adjusted_open.csv"
manifest_path = "Data/derived/prices/lseg_us_sector_33_strategy_adjusted_open.manifest.json"
execution_field = "adjusted_open"
return_convention = "open_to_open"
volatility_window_sessions = 20
volatility_minimum_sessions = 15
volatility_floor = 0.005
fail_on_unsupported_adjustment = true

[execution]
fill_rule = "next_eligible_open"
cost_bps_per_side = 10
allow_same_session_open_only_if_available_before_open = true

[portfolio]
mode = "long_short"
gross_limit = 1.0
net_limit = 0.20
single_name_limit = 0.05
volatility_scaling = true
preserve_signal_sign = true

[tuning]
method = "expanding_chronological"
folds = 3
minimum_training_sessions = 60
validation_sessions = 20
minimum_validation_sessions = 10
half_life_grid = [1, 2, 3, 5, 10]
state_scale_quantile_grid = [0.50, 0.75, 0.90]
no_trade_band_grid = [0.00, 0.10, 0.20]
stability_penalty = 0.5
selection_metric = "median_sharpe_minus_iqr_penalty"
maximum_exposure_violations = 0
minimum_supported_stocks = 25
minimum_active_validation_days = 10

[inference]
method = "paired_block_bootstrap"
block_length_sessions = 5
replications = 2000
seed = 20260715

[reporting]
write_intermediate_artifacts = true
include_gross_and_net = true
include_stock_diagnostics = true
include_leave_one_stock_out = true

[agreement_conditioning]
enabled = false

[outputs]
derived_root = "Data/derived/strategy_research"
results_root = "results/strategy_research"
