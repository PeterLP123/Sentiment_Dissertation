# Canonical LSEG Workspace collection config for the first comprehensive corpus.
# Raw and clean outputs remain local and ignored by Git.

[collection]
id = "lseg_us_mega_cap_1y"
start = "2025-06-26T00:00:00Z"
end = "2026-06-26T00:00:00Z"
language = "en"
session = "desktop"
page_size = 100
max_pages = 3
story_concurrency = 4
retries = 3
window_days = 1

[cleaning]
min_text_chars = 100
max_scoring_chars = 8000

[outputs]
raw_output_root = "Data/news"
derived_output_root = "Data/derived/lseg"

[[companies]]
symbol = "AAPL"
name = "Apple Inc."
ric = "AAPL.O"
news_query = "R:AAPL.O and Language:LEN"
aliases = ["Apple", "AAPL"]

