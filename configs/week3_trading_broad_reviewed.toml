[run]
id = "week3_trading_broad_20260624_reviewed"
title = "Week 3 News-Sentiment Trading Test — Broadened and Reviewed"
timezone = "America/New_York"
dates = ["2026-06-08", "2026-06-09", "2026-06-10"]
horizons = [1, 2, 3, 4, 5, 6, 7]
notional_usd = 10000

[scoring]
models = [
  "openai/gpt-4o-mini",
  "google/gemini-2.5-flash-lite",
  "meta-llama/llama-3.3-70b-instruct",
]
prompt_id = "target_company_news_label_only"
prompts_path = "configs/default_prompts.toml"
temperature = 0.0
max_completion_tokens = 64
concurrency = 3
retries = 3
resume_scores_path = "results/trading/week3_trading_broad_20260624/sentiment_scores.jsonl"

[sources]
tavily_package_manifest = "Data/derived/tavily_ticker_panel_v1/package_manifest.json"
newsapi_sources_file = "Data/derived/trading/week3_trading_broad_20260624/newsapi_sources.json"
screening_overrides_path = "configs/week3_broad_screening_overrides.toml"
newsapi_max_pages = 10

[outputs]
news_output_root = "Data/news"
derived_output_root = "Data/derived/trading"
results_output_root = "results/trading"
experiment_registry = "experiments/manifest.toml"

