# Sector-balanced six-month LSEG Workspace collection.
#
# This configuration intentionally requests all entitled English-language news
# sources. It does not apply an NS:RTRS/Reuters-only filter. Freeze this company
# universe and UTC interval before collection; use a new collection ID for any
# later change. Raw and clean outputs remain local and ignored by Git.

[collection]
id = "us_sector_33_6m"
start = "2025-12-26T00:00:00Z"
end = "2026-06-26T00:00:00Z"
language = "en"
session = "desktop"
page_size = 100
# Raised from 3 after the in-progress all-source pilot found an AAPL day with
# more than 300 matching headlines. Existing query/window checkpoints remain valid.
max_pages = 10
story_concurrency = 4
retries = 3
# Smooth all headline, story, and retry request starts below LSEG's documented
# approximately five-requests-per-second Workspace session limit.
requests_per_second = 3.0
window_days = 1

[cleaning]
min_text_chars = 100
max_scoring_chars = 8000

[outputs]
raw_output_root = "Data/collections/lseg_us_sector_33_6m/raw"
derived_output_root = "Data/collections/lseg_us_sector_33_6m/derived"

