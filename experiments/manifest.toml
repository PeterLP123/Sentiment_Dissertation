interpretation_notes = "Exploratory and in-sample by construction: subset and weight selection maximise a development Sharpe over 127 correlated candidate subsets. Under a demeaned moving-block bootstrap null of no edge (covariance preserved) the expected maximum subset Sharpe is 1.411 against an observed 1.274, and 52.2 percent of null replications reach or exceed the observed value. The winning subset is therefore not statistically distinguishable from data-snooping noise, and the reported Sharpe is an upper bound rather than an estimate."

