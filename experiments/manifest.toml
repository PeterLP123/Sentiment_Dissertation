interpretation_notes = "Null result, retained. Net of the 10.0 bps per side charged on turnover the development Sharpe is negative for every one of the seven scorers individually (from -0.583 for headline/sentiment_all down to -3.402 for headline/sentiment_reuters) and therefore for all 127 candidate subsets, the global best being -0.583. The breakeven cost for the winning subset is 6.86 bps per side, below the charged 10.0 bps, so the gross edge does not survive execution. Because mean returns are negative, averaging signals lowers volatility without adding return and the Sharpe-maximising subset degenerates to the least-bad single signal, headline/sentiment_all, rather than a diversified combination; the best pair and triple are likewise dominated by it. 89.6 percent of demeaned no-edge null replications reach or exceed the observed -0.583."
