[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "news-sentiment-beyond-mean"
version = "0.1.0"
description = "Reproducible experiments for a dissertation on within-day news-sentiment aggregation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "exchange-calendars>=4.8",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=19",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
  "jupyterlab>=4.2",
  "nbconvert>=7.16",
  "nbformat>=5.10",
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
include = ["experiments*"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["experiments/notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
